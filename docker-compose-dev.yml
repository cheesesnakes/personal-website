services:
  jekyll:
    container_name: website_builder
    image: amirpourmand/al-folio:v0.16.3
    mem_limit: 2g
    ports:
      - 4080:4080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
      - ./docker/imagemagick-policy.xml:/etc/ImageMagick-7/policy.xml:ro
    environment:
      - JEKYLL_ENV=production