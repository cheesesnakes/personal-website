  head: [Side project, With Dakshin Foundation]
  title: Priorities for the islands
  title_size: small
  notes: >
    Island ecosystems are especially exposed to climate change. We surveyed
    researchers and stakeholders who live or work in the Andaman and Nicobar
    Islands to find the <mark>most pressing research and management questions</mark>.
