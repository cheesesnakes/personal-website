left:
  head: ["Andaman Islands, cont.", Chapter 2]
  title: Reefs in silico
  notes: >
    What happens when people replace the apex predators? I built an
    agent-based model with <mark>apex predators, mesopredators and herbivores</mark>
    that learn to fear, to see how risk from humans plays out in space and in
    population dynamics.
  video: /assets/video/space_lv.mp4

