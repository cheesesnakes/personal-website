notes: >
  I study how the behaviour of individual animals adds up to large-scale
  patterns in ecosystems, and how <mark>humans, as part of those systems,</mark>
  change them.

bio: |
  I’m trained as an ecologist, but I treat people as part of the natural systems I study. I’ve worked on birds, butterflies, sea snakes, sharks and reef fish, and anthropogenic change has run through all of it.

  I completed my Ph.D. as a Prime Minister’s Research Fellow at the Centre for Ecological Sciences, IISc, Bangalore. I’m now a postdoctoral researcher in the CaFE Lab (Dr. Meghna Krishnadas) at NCBS, Bengaluru. Before that, at Dakshin Foundation, I helped manage the sharks and rays projects, our long-term work at Malvan, and projects in the Andaman Islands.

