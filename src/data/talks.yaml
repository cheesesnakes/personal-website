- year: 2026
  items:
    - kind: Talk
      title: "Out of sight, out of mind: Removal of predators by fisheries alters reef fish behaviour"
      where: "ISBE 2026, Turin, Italy (July)"
      authors: "Shawn Dsouza, Akshta Joshi, Rahul Demello, Babu Kutty, Jeevan Horo, Saw Thesoro, Chaitanya Arjunwadkar, Tanmay Wagh, Titus Immanuel, Maria Thaker, Kartik Shanker"
      abstract: >-
        Pervasive human activities have led to the widespread loss of predators from many ecosystems, yet we know relatively little about how this loss reshapes prey behaviour and, in turn, ecosystem functioning. In this study, we examine how predator removal by fisheries alters the behaviour of reef-associated fish in the South Andaman Islands of India. Using a gradient of protection across two marine protected areas (MPAs) and adjacent fished reefs, we combined observational surveys with a predator-cue experiment. First, we quantified piscivorous predator assemblages, reef habitat structure, and the behaviour of herbivorous and invertivorous prey fish both inside and outside MPAs. We then deployed 3D-printed models of two predator types, a sit-and-wait grouper (Plectropomus maculatus) and a wide-ranging pursuit predator, the barracuda (Sphyraena barracuda), to test how prey respond to simulated predation risk. Predator abundance, coral cover, and habitat quality were consistently higher inside MPAs. Correspondingly, prey fish inside MPAs showed reduced movement, increased vigilance, and higher foraging rates compared to those on fished reefs. Habitat complexity and resource availability further shaped these behaviours in guild-specific ways. In our experiments, fish displayed strong vigilance responses to both predator models inside MPAs, but these responses were absent or attenuated outside MPAs. In general, predator treatments suppressed foraging, but herbivores and invertivores differed markedly in how they adjusted their movement and vigilance across habitats and predator types. Overall, our results show that fishing alters the “seascape of fear” not only by removing predators directly, but also by degrading habitats and changing how prey perceive and respond to risk. Understanding these coupled direct and indirect effects is essential for predicting how human activities reshape ecological interactions and ecosystem functioning.
