services:
  nginx:
    image: nginx
    container_name: personal-website
    volumes:
      - ./dist:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shawn.entrypoints=http"
      - "traefik.http.routers.shawn.rule=Host(`shawn.cheesesnakes.net`) || Host(`shawndsouza.com`)"
      - "traefik.http.middlewares.shawn-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.shawn.middlewares=shawn-https-redirect"
      - "traefik.http.routers.shawn-secure.entrypoints=https"
      - "traefik.http.routers.shawn-secure.rule=Host(`shawn.cheesesnakes.net`) || Host(`shawndsouza.com`)"
      - "traefik.http.routers.shawn-secure.middlewares=crowdsecbouncer@file"
      - "traefik.http.routers.shawn-secure.tls=true"
      - "traefik.http.routers.shawn-secure.service=shawn"
      - "traefik.http.services.shawn.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"

  # Builds the site into ./dist. Run: docker compose run --rm build
  build:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm ci && npm run build"
    profiles: ["build"]

networks:
  proxy:
    external: true
